name: E2E (prod)

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 0"

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Playwright
        working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Run API suite (against production)
        env:
          E2E_API_URL: ${{ secrets.E2E_API_URL || 'https://textilehub-api.vercel.app' }}
        run: python3 e2e/api_tests.py

      - name: Run browser suite (against production)
        if: always()
        working-directory: frontend
        env:
          E2E_BASE_URL: ${{ secrets.E2E_BASE_URL || 'https://textilehub.vercel.app' }}
        run: npx playwright test --config e2e/playwright.config.js

      - name: Upload Playwright traces on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: frontend/test-results/
          retention-days: 7

      - name: Restore seeded baseline (always)
        if: always()
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python3 e2e/cleanup_db.py

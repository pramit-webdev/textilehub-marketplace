services:
  - type: web
    name: textilehub-api
    runtime: python
    plan: free
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        sync: false
      - key: FRONTEND_URL
        value: https://textilehub.vercel.app
      - key: PUBLIC_BASE_URL
        sync: false
      - key: HF_TOKEN
        sync: false
